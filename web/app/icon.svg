<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Amelya's">
  <!--
    Simplified small-mark / favicon (DESIGN §5/§8): a gold monogram A inside a
    laurel ring. The detailed emblem muddies at ≤32px, so this ships instead — a
    thin medallion ring, two laurel sprigs, and a geometric serif A, all in brand
    gold (#a9824b) on a cream ground. Crisp at favicon sizes because it is vector.
  -->
  <rect width="64" height="64" rx="12" fill="#f5f0e4"/>
  <circle cx="32" cy="32" r="25" stroke="#a9824b" stroke-width="1.4" opacity="0.85"/>
  <g stroke="#a9824b" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.9">
    <!-- left laurel sprig, curving up the lower-left of the ring -->
    <path d="M19 48 Q14 40 16 31"/>
    <path d="M17 44 q-4 -1 -5 -4"/>
    <path d="M16 39 q-4 -1 -5 -4"/>
    <path d="M16 34 q-4 0 -5 -3"/>
    <!-- right laurel sprig, mirrored -->
    <path d="M45 48 Q50 40 48 31"/>
    <path d="M47 44 q4 -1 5 -4"/>
    <path d="M48 39 q4 -1 5 -4"/>
    <path d="M48 34 q4 0 5 -3"/>
  </g>
  <!-- monogram A -->
  <g stroke="#a9824b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M23 44 L32 19 L41 44"/>
    <path d="M26.3 35.8 H37.7"/>
  </g>
</svg>
